<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Low contrast text</title></head>
<body>
  <main>
    <h1>Sale this week</h1>
    <p id="grey" style="color:#aaaaaa;background:#ffffff">Light grey text on white.</p>
    <p id="yellow" style="color:#ffe680;background:#ffffff">Pale yellow text on white.</p>
    <p style="color:#1a1a1a;background:#ffffff">This paragraph has good contrast.</p>
  </main>
</body>
</html>
