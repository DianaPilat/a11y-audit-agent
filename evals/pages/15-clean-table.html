<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Clean data table</title></head>
<body>
  <main>
    <h1>Opening hours</h1>
    <table>
      <caption>Weekly opening hours</caption>
      <thead><tr><th scope="col">Day</th><th scope="col">Hours</th></tr></thead>
      <tbody>
        <tr><th scope="row">Monday</th><td>9am to 5pm</td></tr>
        <tr><th scope="row">Saturday</th><td>10am to 2pm</td></tr>
      </tbody>
    </table>
    <button type="button" aria-label="Print opening hours">Print</button>
  </main>
</body>
</html>
